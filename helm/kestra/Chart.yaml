apiVersion: v2
name: kestra
description: Umbrella chart wrapping the upstream kestra chart with our Postgres (postgres-operator) and S3 (ACK) wiring, a Gateway API HTTPRoute, and mirrored images.
type: application
version: 0.1.0
appVersion: "v1.3.16"
kubeVersion: ">=1.22.0-0"

# Dependency is pulled from our own OCI mirror (populated by .github/workflows/build.yml
# from helm.kestra.io) so deploys never reach the upstream chart repo.
dependencies:
  - name: kestra
    version: 1.3.16
    repository: oci://docker.io/alphaprosoft
    alias: upstream
