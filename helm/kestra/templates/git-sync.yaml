{{- if .Values.git.enabled -}}
{{- $url := required "git.url is required when git.enabled" .Values.git.url -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-git-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kestra
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kestra
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  flow.yml: |
    id: git-flow-sync
    namespace: system
    description: Syncs flows under "{{ .Values.git.targetNamespace }}" from {{ $url }} — managed by kestra-helm; do not edit in the UI.
    tasks:
      - id: sync-flows
        type: io.kestra.plugin.git.SyncFlows
        url: {{ $url | quote }}
        branch: {{ .Values.git.branch | quote }}
        gitDirectory: {{ .Values.git.gitDirectory | quote }}
        targetNamespace: {{ .Values.git.targetNamespace | quote }}
        includeChildNamespaces: {{ .Values.git.includeChildNamespaces }}
        delete: {{ .Values.git.delete }}
        dryRun: false
        {{- if .Values.git.auth.enabled }}
        username: "{{ `{{ envs.git_username }}` }}"
        password: "{{ `{{ envs.git_password }}` }}"
        {{- end }}
    triggers:
      - id: schedule
        type: io.kestra.plugin.core.trigger.Schedule
        cron: {{ .Values.git.syncInterval | quote }}
{{- end }}
