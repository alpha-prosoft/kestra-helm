{{- if .Values.gatewayApi.enabled -}}
{{- $svc := .Values.upstream.fullnameOverride | default "kestra" -}}
{{- $port := dig "service" "ports" "http" "port" 8080 .Values.upstream -}}
{{- $hostedZone := required "gatewayApi.hostedZoneName is required when gatewayApi.enabled" .Values.gatewayApi.hostedZoneName -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kestra
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kestra
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.parentRef.name }}
      namespace: {{ .Values.gatewayApi.parentRef.namespace }}
      sectionName: {{ .Values.gatewayApi.parentRef.sectionName }}
  hostnames:
    - {{ printf "%s.%s" .Values.gatewayApi.subdomain $hostedZone | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $svc }}
          port: {{ $port }}
{{- end }}
