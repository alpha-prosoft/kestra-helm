{{- if .Values.database.create -}}
apiVersion: postgres.alpha-prosoft.com/v1
kind: DatabaseInstance
metadata:
  name: kestra-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kestra
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kestra
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  databaseName: {{ .Values.database.databaseName | quote }}
  targetSecretName: {{ .Values.database.targetSecretName | quote }}
{{- end }}
