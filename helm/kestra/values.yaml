# Gateway API HTTPRoute, exposed at <subdomain>.<hostedZoneName>.
gatewayApi:
  enabled: false
  subdomain: kestra
  hostedZoneName: ""
  parentRef:
    name: alb
    namespace: gateway-system
    sectionName: https

# PostgreSQL provisioned by postgres-operator (DatabaseInstance -> Secret).
database:
  create: true
  databaseName: kestra_db
  targetSecretName: kestra-master

# S3 storage bucket provisioned by the ACK S3 controller (Bucket CR).
# region and bucketName are required and also flow into Kestra's storage config.
aws:
  region: ""
  s3:
    create: true
    bucketName: ""
    publicAccessBlock:
      blockPublicACLs: true
      blockPublicPolicy: true
      ignorePublicACLs: true
      restrictPublicBuckets: true
    tags: {}

# Git source for workflows. See README. When enabled, renders the
# kestra-git-sync ConfigMap (the system/git-flow-sync SyncFlows flow) and the
# git-sync-bootstrap sidecar registers it once the API is up.
git:
  enabled: false
  url: ""
  branch: main
  gitDirectory: "_flows"
  targetNamespace: kestra
  includeChildNamespaces: true
  delete: true
  syncInterval: "*/5 * * * *"
  # When true, the SyncFlows task passes {{ envs.git_username }} / {{ envs.git_password }}
  # (resolved from the kestra-auth Secret's gitUser/gitToken keys). Imported flows that
  # do their own git work reference the same envs.* variables.
  auth: false

# Single kestra-auth Secret holding all four credentials Kestra needs. Bring this
# Secret yourself with the four keys below, or set the kubeseal-encrypted plaintext
# values to have this chart render a SealedSecret for it.
#
#   basicAuthEmail    — Kestra server basic auth username (must be a valid email).
#   basicAuthPassword — Kestra server basic auth password. The git-sync bootstrap
#                       sidecar uses these two to authenticate its API calls.
#   gitUser           — git username used by the SyncFlows task and any imported
#                       flow referencing {{ envs.git_username }}.
#   gitToken          — git password / PAT used the same way.
#
# Mounted into KESTRA_SERVER_BASIC_AUTH_USERNAME/PASSWORD and ENV_GIT_USERNAME/PASSWORD
# env vars (all optional: a missing key only breaks that one feature, not the pod).
auth:
  encryptedBasicAuthEmail: ""
  encryptedBasicAuthPassword: ""
  encryptedGitUser: ""
  encryptedGitToken: ""

# Values forwarded to the upstream kestra chart:
# https://github.com/kestra-io/helm-charts/blob/master/charts/kestra/values.yaml
upstream:
  nameOverride: kestra
  fullnameOverride: kestra

  image:
    repository: docker.io/alphaprosoft/kestra
    pullPolicy: IfNotPresent

  deployments:
    standalone:
      enabled: true
      dind:
        enabled: true
    webserver:
      enabled: false
    executor:
      enabled: false
    indexer:
      enabled: false
    scheduler:
      enabled: false
    worker:
      enabled: false

  dind:
    enabled: true
    base:
      rootless:
        image:
          repository: docker.io/alphaprosoft/docker
          tag: dind-rootless

  common:
    extraEnv:
      - name: KESTRA_PG_HOST
        valueFrom:
          secretKeyRef:
            name: kestra-master
            key: host
      - name: KESTRA_PG_PORT
        valueFrom:
          secretKeyRef:
            name: kestra-master
            key: port
      - name: KESTRA_PG_DATABASE
        valueFrom:
          secretKeyRef:
            name: kestra-master
            key: database
      - name: KESTRA_PG_USERNAME
        valueFrom:
          secretKeyRef:
            name: kestra-master
            key: username
      - name: KESTRA_PG_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kestra-master
            key: password
      - name: ENV_GIT_USERNAME
        valueFrom:
          secretKeyRef:
            name: kestra-auth
            key: gitUser
            optional: true
      - name: ENV_GIT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kestra-auth
            key: gitToken
            optional: true
      - name: KESTRA_SERVER_BASIC_AUTH_USERNAME
        valueFrom:
          secretKeyRef:
            name: kestra-auth
            key: basicAuthEmail
            optional: true
      - name: KESTRA_SERVER_BASIC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kestra-auth
            key: basicAuthPassword
            optional: true

    extraVolumes:
      - name: kestra-git-sync
        configMap:
          name: kestra-git-sync
          optional: true

    extraContainers:
      - name: git-sync-bootstrap
        image: docker.io/alphaprosoft/kestra:v1.3.16
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: kestra-auth
              optional: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            FLOW=/git-sync/flow.yml
            API=http://127.0.0.1:8080
            MGMT=http://127.0.0.1:8081
            AUTH="${basicAuthEmail:-}:${basicAuthPassword:-}"
            if [ ! -f "$FLOW" ]; then
              echo "[git-sync] not configured; idling."
              exec sleep infinity
            fi
            echo "[git-sync] waiting for Kestra to become ready..."
            until curl -fsS -o /dev/null "$MGMT/health/readiness"; do sleep 5; done
            echo "[git-sync] registering flow system/git-flow-sync"
            attempt=0
            while :; do
              attempt=$((attempt + 1))
              code=$(curl -s -u "$AUTH" -o /tmp/resp -w '%{http_code}' -X POST -H 'Content-Type: application/x-yaml' --data-binary @"$FLOW" "$API/api/v1/flows")
              case "$code" in
                2*) echo "[git-sync] flow created."; break ;;
                409|422)
                  code=$(curl -s -u "$AUTH" -o /tmp/resp -w '%{http_code}' -X PUT -H 'Content-Type: application/x-yaml' --data-binary @"$FLOW" "$API/api/v1/flows/system/git-flow-sync")
                  case "$code" in 2*) echo "[git-sync] flow updated."; break ;; esac ;;
              esac
              echo "[git-sync] attempt $attempt: HTTP $code: $(cat /tmp/resp 2>/dev/null)"
              if [ "$attempt" -ge 30 ]; then echo "[git-sync] giving up; idling."; exec sleep infinity; fi
              sleep 10
            done
            curl -fsS -u "$AUTH" -o /dev/null -X POST "$API/api/v1/executions/system/git-flow-sync" || echo "[git-sync] initial trigger skipped; Schedule trigger will sync."
            echo "[git-sync] done; idling."
            exec sleep infinity
        volumeMounts:
          - name: kestra-git-sync
            mountPath: /git-sync
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

  configurations:
    application:
      datasources:
        postgres:
          url: jdbc:postgresql://${KESTRA_PG_HOST}:${KESTRA_PG_PORT}/${KESTRA_PG_DATABASE}
          driverClassName: org.postgresql.Driver
          username: ${KESTRA_PG_USERNAME}
          password: ${KESTRA_PG_PASSWORD}
      kestra:
        queue:
          type: postgres
        repository:
          type: postgres
        server:
          basic-auth:
            username: ${KESTRA_SERVER_BASIC_AUTH_USERNAME:}
            password: ${KESTRA_SERVER_BASIC_AUTH_PASSWORD:}
        tasks:
          sdk:
            authentication:
              username: ${KESTRA_SERVER_BASIC_AUTH_USERNAME:}
              password: ${KESTRA_SERVER_BASIC_AUTH_PASSWORD:}
    configmaps:
      - name: kestra-extra-config
        key: storage.yml
    secrets: []
