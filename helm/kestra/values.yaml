# Gateway API HTTPRoute, exposed at <subdomain>.<hostedZoneName>.
gatewayApi:
  enabled: false
  subdomain: kestra
  hostedZoneName: ""
  parentRef:
    name: alb
    namespace: gateway-system
    sectionName: https

# PostgreSQL provisioned by postgres-operator (DatabaseInstance -> Secret).
database:
  create: true
  databaseName: kestra_db
  targetSecretName: kestra-master

# S3 storage bucket provisioned by the ACK S3 controller (Bucket CR).
# region and bucketName are required and also flow into Kestra's storage config.
aws:
  region: ""
  s3:
    create: true
    bucketName: ""
    publicAccessBlock:
      blockPublicACLs: true
      blockPublicPolicy: true
      ignorePublicACLs: true
      restrictPublicBuckets: true
    tags: {}

# Git source for workflows. See README. When enabled, renders the
# kestra-git-sync ConfigMap (the system/git-flow-sync SyncFlows flow) and the
# git-sync-bootstrap sidecar registers it once the API is up.
git:
  enabled: false
  url: ""
  branch: main
  gitDirectory: "_flows"
  targetNamespace: kestra
  includeChildNamespaces: true
  delete: true
  syncInterval: "*/5 * * * *"
  # Private-repo auth. The flow reads {{ envs.git_username }} / {{ envs.git_password }}
  # from the kestra-git-auth Secret. Either bring that Secret yourself, or set the
  # kubeseal-encrypted plaintext values below to have this chart render a SealedSecret.
  auth:
    enabled: false
    encryptedUsername: ""
    encryptedPassword: ""

# Kestra basic auth (mandatory since Kestra 0.24 — the API returns 401 until it
# is configured). Credentials come from the kestra-basic-auth Secret (keys
# username [a valid email] and password); the bootstrap sidecar uses them too.
# Bring that Secret yourself, or set the kubeseal-encrypted values to have this
# chart render a SealedSecret for it.
basicAuth:
  encryptedUsername: ""
  encryptedPassword: ""

# Values forwarded to the upstream kestra chart:
# https://github.com/kestra-io/helm-charts/blob/master/charts/kestra/values.yaml
upstream:
  nameOverride: kestra
  fullnameOverride: kestra

  image:
    repository: docker.io/alphaprosoft/kestra
    pullPolicy: IfNotPresent

  deployments:
    standalone:
      enabled: true
      dind:
        enabled: true
    webserver:
      enabled: false
    executor:
      enabled: false
    indexer:
      enabled: false
    scheduler:
      enabled: false
    worker:
      enabled: false

  dind:
    enabled: true
    base:
      rootless:
        image:
          repository: docker.io/alphaprosoft/docker
          tag: dind-rootless

  common:
    extraEnv:
      - name: KESTRA_PG_HOST
        valueFrom:
          secretKeyRef:
            name: kestra-db
            key: host
      - name: KESTRA_PG_PORT
        valueFrom:
          secretKeyRef:
            name: kestra-db
            key: port
      - name: KESTRA_PG_DATABASE
        valueFrom:
          secretKeyRef:
            name: kestra-db
            key: database
      - name: KESTRA_PG_USERNAME
        valueFrom:
          secretKeyRef:
            name: kestra-db
            key: username
      - name: KESTRA_PG_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kestra-db
            key: password
      - name: ENV_GIT_USERNAME
        valueFrom:
          secretKeyRef:
            name: kestra-git-auth
            key: username
            optional: true
      - name: ENV_GIT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kestra-git-auth
            key: password
            optional: true
      - name: KESTRA_SECURITY_BASIC_AUTH_USERNAME
        valueFrom:
          secretKeyRef:
            name: kestra-basic-auth
            key: username
            optional: true
      - name: KESTRA_SECURITY_BASIC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kestra-basic-auth
            key: password
            optional: true

    extraVolumes:
      - name: kestra-git-sync
        configMap:
          name: kestra-git-sync
          optional: true

    extraContainers:
      - name: git-sync-bootstrap
        image: docker.io/alphaprosoft/kestra:v1.3.16
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: kestra-basic-auth
              optional: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            FLOW=/git-sync/flow.yml
            API=http://127.0.0.1:8080
            MGMT=http://127.0.0.1:8081
            AUTH="${username:-}:${password:-}"
            if [ ! -f "$FLOW" ]; then
              echo "[git-sync] not configured; idling."
              exec sleep infinity
            fi
            echo "[git-sync] waiting for Kestra to become ready..."
            until curl -fsS -o /dev/null "$MGMT/health/readiness"; do sleep 5; done
            echo "[git-sync] registering flow system/git-flow-sync"
            attempt=0
            while :; do
              attempt=$((attempt + 1))
              code=$(curl -s -u "$AUTH" -o /tmp/resp -w '%{http_code}' -X POST -H 'Content-Type: application/x-yaml' --data-binary @"$FLOW" "$API/api/v1/flows")
              case "$code" in
                2*) echo "[git-sync] flow created."; break ;;
                409|422)
                  code=$(curl -s -u "$AUTH" -o /tmp/resp -w '%{http_code}' -X PUT -H 'Content-Type: application/x-yaml' --data-binary @"$FLOW" "$API/api/v1/flows/system/git-flow-sync")
                  case "$code" in 2*) echo "[git-sync] flow updated."; break ;; esac ;;
              esac
              echo "[git-sync] attempt $attempt: HTTP $code: $(cat /tmp/resp 2>/dev/null)"
              if [ "$attempt" -ge 30 ]; then echo "[git-sync] giving up; idling."; exec sleep infinity; fi
              sleep 10
            done
            curl -fsS -u "$AUTH" -o /dev/null -X POST "$API/api/v1/executions/system/git-flow-sync" || echo "[git-sync] initial trigger skipped; Schedule trigger will sync."
            echo "[git-sync] done; idling."
            exec sleep infinity
        volumeMounts:
          - name: kestra-git-sync
            mountPath: /git-sync
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

  configurations:
    application:
      datasources:
        postgres:
          url: jdbc:postgresql://${KESTRA_PG_HOST}:${KESTRA_PG_PORT}/${KESTRA_PG_DATABASE}
          driverClassName: org.postgresql.Driver
          username: ${KESTRA_PG_USERNAME}
          password: ${KESTRA_PG_PASSWORD}
      kestra:
        queue:
          type: postgres
        repository:
          type: postgres
    configmaps:
      - name: kestra-extra-config
        key: storage.yml
    secrets: []
